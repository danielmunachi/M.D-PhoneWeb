<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | M.D Gadgets</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/admin.css"></head><body class="admin-page"><main class="admin-shell"><form id="admin-login" class="admin-login"><p class="eyebrow">M.D Gadgets</p><h1>Admin access</h1><p class="muted">Frontend prototype only. Connect this screen to secure server-side authentication before production.</p><label>Email<input required type="email" placeholder="admin@example.com"></label><label>Password<input required type="password" placeholder="Your password"></label><button class="btn btn-gold" type="submit">Login</button></form><section id="admin-panel" hidden><div class="admin-panel-head"><div><p class="eyebrow">Management console</p><h1>Product dashboard</h1></div><div><a class="btn btn-outline" href="index.html">View store</a><button id="logout" class="btn btn-quiet">Log out</button></div></div><div id="stats" class="stats"></div><div class="admin-grid"><form id="product-form" class="admin-form"><h2 id="form-title">Add new device</h2><div class="field-grid"><label>Product name<input required name="name"></label><label>Brand<input required name="brand"></label><label>Category<select required name="category"><option>Phones</option><option>Laptops</option><option>PlayStation</option><option>Accessories</option></select></label><label>Price<input required type="number" name="price" min="0"></label><label>Old price<input type="number" name="oldPrice" min="0"></label><label>Storage<input name="storage" placeholder="e.g. 128GB"></label><label>RAM<input name="ram" placeholder="e.g. 8GB"></label><label>Condition<input required name="condition" placeholder="e.g. UK Used"></label><label>Status<select name="status"><option>SELL</option><option>SOLD</option><option>HOT-DEAL</option></select></label><label>Stock availability<select name="stock"><option value="true">In stock</option><option value="false">Out of stock</option></select></label></div><label>Description<textarea required name="description"></textarea></label><label>Product image path or URL<input name="image" placeholder="assets/images/phones/example.jpg"></label><label>Additional image paths / URLs (comma separated)<input name="gallery"></label><button class="btn btn-gold" type="submit">Save changes</button><button class="btn btn-outline" type="button" id="cancel-edit">Cancel</button></form><div class="admin-table-wrap"><h2>Product management</h2><table class="admin-table"><thead><tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead><tbody id="admin-products"></tbody></table></div></div></section></main><script src="js/products.js"></script><script src="js/admin.js"></script></body></html>
